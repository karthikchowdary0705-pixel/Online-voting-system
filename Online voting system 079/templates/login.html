<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>CloudVote - Login</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f2f6ff;
    }

    nav {
        background: #172554;
        color: white;
        padding: 20px 50px;
        display: flex;
        justify-content: space-between;
    }

    nav h2 {
        margin: 0;
    }

    nav a {
        color: white;
        text-decoration: none;
        margin-left: 20px;
    }

    .login-box {
        width: 400px;
        max-width: 85%;
        margin: 80px auto;
        background: white;
        padding: 35px;
        border-radius: 12px;
        box-shadow: 0 5px 20px #ccc;
    }

    .login-box h1 {
        text-align: center;
        color: #172554;
    }

    label {
        display: block;
        margin-top: 20px;
        margin-bottom: 8px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 13px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
    }

    button {
        width: 100%;
        padding: 14px;
        margin-top: 25px;
        border: none;
        border-radius: 7px;
        background: #2563eb;
        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #1d4ed8;
    }

    .message {
        background: #fee2e2;
        color: #991b1b;
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 6px;
        text-align: center;
    }

    .register {
        text-align: center;
        margin-top: 20px;
    }

    .register a {
        color: #2563eb;
        text-decoration: none;
        font-weight: bold;
    }
</style>
```

</head>

<body>

```
<nav>

    <h2>☁️ CloudVote</h2>

    <div>
        <a href="/">Home</a>
        <a href="/register">Register</a>
        <a href="/result">Results</a>
    </div>

</nav>


<div class="login-box">

    <h1>🔐 Login</h1>

    {% with messages = get_flashed_messages() %}

        {% for message in messages %}

            <div class="message">
                {{ message }}
            </div>

        {% endfor %}

    {% endwith %}


    <form method="POST" action="/login">

        <label>Username</label>

        <input
            type="text"
            name="username"
            placeholder="Enter your username"
            required
        >


        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <div class="register">

        Don't have an account?

        <a href="/register">
            Register here
        </a>

    </div>

</div>
```

</body>

</html>
