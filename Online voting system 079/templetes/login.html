<!DOCTYPE html>
<html>

<head>

    <title>Login - CloudVote</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav>

    <div class="logo">☁️ CloudVote</div>

    <div>
        <a href="/">Home</a>
        <a href="/register">Register</a>
    </div>

</nav>

<div class="form-container">

    <h1>Login</h1>

    {% with messages = get_flashed_messages() %}

        {% for message in messages %}

            <div class="message">
                {{ message }}
            </div>

        {% endfor %}

    {% endwith %}

    <form method="POST">

        <label>Username</label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

</div>

</body>
</html>
